
name: Build Niuma Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: rainchestnut/niuma
          ref: a6d214aabfdc7e308881848c95ce74108baabbb3
          path: source
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          mkdir -p output
          if [[ -d /Applications/Xcode_26.4.1.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project source/niuma-ios/niuma.xcodeproj \
            -scheme niuma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/niuma-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee output/build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/niuma-derived/Build/Products/Release-iphoneos/niuma.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          platform=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")
          test "$platform" = iphoneos
          xcrun lipo -verify_arch arm64 "$app/$executable"
          if [[ -e "$app/_CodeSignature" || -e "$app/embedded.mobileprovision" ]]; then
            echo "Unexpected signing data"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/niuma-package/Payload"
          ditto "$app" "$RUNNER_TEMP/niuma-package/Payload/niuma.app"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/niuma-package/Payload" \
            "$GITHUB_WORKSPACE/output/Niuma-unsigned.ipa"
          unzip -t output/Niuma-unsigned.ipa
          shasum -a 256 output/Niuma-unsigned.ipa > output/SHA256SUMS.txt

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Niuma-unsigned
          path: output/
          if-no-files-found: warn
          retention-days: 7
