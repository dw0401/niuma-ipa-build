name: Build Niuma Windows Gateway
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Download inspected source
      uses: actions/checkout@v4
      with:
        repository: rainchestnut/niuma
        ref: a6d214aabfdc7e308881848c95ce74108baabbb3
        path: source
        persist-credentials: false
    - name: Apply Windows user directory compatibility
      shell: bash
      run: |
        python <<'PY'
        from pathlib import Path
        base = Path('source/niuma-cli/src')
        for filename in ['paths.rs', 'metadata.rs', 'file_access.rs']:
            path = base / filename
            text = path.read_text(encoding='utf-8')
            needle = 'std::env::var_os("HOME")'
            assert text.count(needle) == 1, filename
            text = text.replace(needle, needle + '.or_else(|| std::env::var_os("USERPROFILE"))')
            path.write_text(text, encoding='utf-8')
        path = base / 'identity.rs'
        text = path.read_text(encoding='utf-8')
        needle = 'os_type: "darwin".to_string(),'
        assert text.count(needle) == 1
        text = text.replace(needle, 'os_type: if cfg!(target_os = "macos") { "darwin" } else { std::env::consts::OS }.to_string(),')
        path.write_text(text, encoding='utf-8')
        PY
    - name: Adapt modern Codex project metadata and keep connection alive
      shell: bash
      run: |
        python <<'PY'
        from pathlib import Path

        base = Path('source/niuma-cli/src')
        path = base / 'metadata.rs'
        text = path.read_text(encoding='utf-8')
        old = '''        serde_json::from_str(&payload).unwrap_or_else(|_| empty_state())'''
        new = '''        let Ok(mut value) = serde_json::from_str::<Value>(&payload) else {
                    return empty_state();
                };
                // Newer Codex desktop versions store project ids in project-order,
                // and resolve their actual workspace paths through local-projects.
                // Adapt a copy in memory; never rewrite Codex's state file.
                if let Some(local_projects) = value.get("local-projects").and_then(Value::as_object).cloned() {
                    let mut ids: Vec<String> = value.get("project-order")
                        .and_then(Value::as_array)
                        .into_iter().flatten().filter_map(Value::as_str)
                        .map(str::to_string).collect();
                    ids.extend(local_projects.keys().cloned());
                    let mut seen = std::collections::HashSet::new();
                    let mut roots = Vec::new();
                    let mut labels = value.get("electron-workspace-root-labels")
                        .and_then(Value::as_object).cloned().unwrap_or_default();
                    for id in ids {
                        if let Some(project) = local_projects.get(&id) {
                            for root in project.get("rootPaths").and_then(Value::as_array)
                                .into_iter().flatten().filter_map(Value::as_str)
                            {
                                if root.trim().is_empty() { continue; }
                                let root = normalize_root(root);
                                if seen.insert(root.clone()) {
                                    if let Some(name) = project.get("name").and_then(Value::as_str)
                                        .filter(|name| !name.is_empty())
                                    {
                                        labels.insert(root.clone(), json!(name));
                                    }
                                    roots.push(root);
                                }
                            }
                        } else if PathBuf::from(&id).is_absolute() {
                            // Retain path entries in mixed old/new desktop snapshots.
                            let root = normalize_root(&id);
                            if seen.insert(root.clone()) { roots.push(root); }
                        }
                    }
                    value["project-order"] = json!(roots);
                    value["electron-workspace-root-labels"] = Value::Object(labels);
                }
                serde_json::from_value(value).unwrap_or_else(|_| empty_state())'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        test = r'''
            #[test]
            fn workspace_store_reads_modern_project_ids_without_modifying_source() {
                let root = std::env::temp_dir().join(format!("niuma-modern-{}", uuid::Uuid::new_v4()));
                std::fs::create_dir_all(&root).unwrap();
                let first = root.join("first").to_string_lossy().into_owned();
                let second = root.join("second").to_string_lossy().into_owned();
                let state_path = root.join("state.json");
                let original = serde_json::to_string(&json!({
                    "project-order": ["project-b", "missing-project", "project-a"],
                    "local-projects": {
                        "project-a": {"name": "First", "rootPaths": [first, ""]},
                        "project-b": {"name": "Second", "rootPaths": [second, first]}
                    },
                    "projectless-thread-ids": ["thread-one"]
                })).unwrap();
                std::fs::write(&state_path, &original).unwrap();
                let store = CodexWorkspaceStore { global_state_path: state_path.clone() };
                let projects = store.list_projects();
                assert_eq!(projects.len(), 2);
                assert_eq!(projects[0].cwd.as_deref(), Some(normalize_root(&second).as_str()));
                assert_eq!(projects[1].cwd.as_deref(), Some(normalize_root(&first).as_str()));
                assert_eq!(projects[0].project_name, "Second");
                assert_eq!(store.list_projectless_thread_ids(), vec!["thread-one"]);
                assert_eq!(std::fs::read_to_string(&state_path).unwrap(), original);
                std::fs::remove_dir_all(root).unwrap();
            }

        '''
        anchor = '    #[test]\n    fn workspace_store_orders_and_deduplicates_roots()'
        assert text.count(anchor) == 1
        text = text.replace(anchor, test + anchor)
        old_expected = 'vec!["/tmp/a", "/tmp/b", "/tmp/c"]'
        new_expected = 'vec![normalize_root("/tmp/a"), normalize_root("/tmp/b"), normalize_root("/tmp/c")]'
        assert text.count(old_expected) == 1
        text = text.replace(old_expected, new_expected)
        path.write_text(text, encoding='utf-8')

        path = base / 'realtime.rs'
        text = path.read_text(encoding='utf-8')
        old = '''        .map(CodexAppServerClient::subscribe_notifications);
            loop {
                tokio::select! {'''
        new = '''        .map(CodexAppServerClient::subscribe_notifications);
            // A ping receives an automatic pong from Axum, keeping nginx's
            // upstream read timeout from closing an otherwise idle connection.
            let mut heartbeat = tokio::time::interval(Duration::from_secs(20));
            loop {
                tokio::select! {
                    _ = heartbeat.tick() => {
                        writer.send(Message::Ping(Vec::new().into())).await?;
                    }'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        path.write_text(text, encoding='utf-8')
        PY
    - name: Fix notification replay feedback loop
      shell: bash
      run: |
        python <<'PY'
        from pathlib import Path

        base = Path('source/niuma-cli/src')
        path = base / 'tasks.rs'
        text = path.read_text(encoding='utf-8')
        old = '''        let thread_payload = self
                    .app_server
                    .resume_thread_payload(&message.thread_id, None, None, None, None)
                    .await
                    .unwrap_or_else(|_| json!({ "id": message.thread_id }));
                let replay_payload = self
                    .app_server
                    .read_thread_payload(&message.thread_id, true)
                    .await
                    .unwrap_or(thread_payload);'''
        new = '''        // History projection is read-only. Resuming here generates new
                // lifecycle notifications and can feed this replay path indefinitely.
                // Actual mobile task submission still resumes in start_task_messages.
                let replay_payload = self
                    .app_server
                    .read_thread_payload(&message.thread_id, true)
                    .await?;'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        anchor = '    #[test]\n    fn conversation_project_route_omits_workspace_cwd()'
        test = r'''    #[tokio::test]
            async fn history_replay_reads_without_resuming_or_swallowing_errors() {
                crate::paths::ensure_state_dirs().unwrap();
                let root = std::env::temp_dir().join(format!("niuma-replay-{}", uuid::Uuid::new_v4()));
                std::fs::create_dir_all(&root).unwrap();
                let script = root.join("fake_server.py");
                let requests = root.join("requests.txt");
                std::fs::write(&script, r#"
        import json, sys
        for line in sys.stdin:
            message = json.loads(line)
            if 'id' not in message:
                continue
            method = message['method']
            with open(sys.argv[1], 'a') as f:
                f.write(method + '\n')
            if method == 'initialize':
                response = {'result': {}}
            elif method == 'thread/read' and message['params']['threadId'] == 'missing':
                response = {'error': {'code': -32600, 'message': 'missing thread'}}
            elif method == 'thread/read':
                print(json.dumps({'method': 'deprecationNotice', 'params': {'threadId': 'test-thread'}}), flush=True)
                response = {'result': {'thread': {'id': 'test-thread', 'turns': []}}}
            else:
                response = {'error': {'code': -32601, 'message': 'unexpected mutation: ' + method}}
            response['id'] = message['id']
            print(json.dumps(response), flush=True)
        "#).unwrap();
                let client = CodexAppServerClient::start(&[
                    "python".to_string(), script.to_string_lossy().into_owned(),
                    requests.to_string_lossy().into_owned(),
                ]).await.unwrap();
                let identity = AgentIdentity {
                    agent_id: "agent".into(), device_name: "test".into(), os_type: "windows".into(),
                    signing_private_key: String::new(), signing_public_key: String::new(),
                    signing_key_fingerprint: String::new(), encryption_private_key: String::new(),
                    encryption_public_key: String::new(), encryption_key_fingerprint: String::new(),
                };
                let runtime = TaskRuntime::new(identity, client, None);
                let inbound = |thread_id: &str| ResumeThreadInbound {
                    request_id: None, device_id: "phone".into(), thread_id: thread_id.into(),
                    cursor: 0, checkpoint: None,
                };
                runtime.resume_thread_messages(inbound("test-thread")).await.unwrap();
                assert!(runtime.resume_thread_messages(inbound("missing")).await.is_err());
                let methods = std::fs::read_to_string(&requests).unwrap();
                assert_eq!(methods.lines().collect::<Vec<_>>(),
                    vec!["initialize", "thread/read", "thread/read"]);
                drop(runtime);
                let _ = std::fs::remove_dir_all(root);
            }

        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, test + anchor)
        path.write_text(text, encoding='utf-8')

        path = base / 'realtime.rs'
        text = path.read_text(encoding='utf-8')
        anchor = 'async fn handle_app_server_event<S, E>('
        helper = '''// Read-only queries can emit deprecation, token-usage and goal notices.
        // Only events that change visible turn/item content need history replay.
        fn notification_requires_history_replay(event: &Value) -> bool {
            match notification_method(event) {
                Some("turn/started" | "turn/completed") => true,
                Some(method) if method.starts_with("item/") => true,
                _ => false,
            }
        }

        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, helper + anchor)
        old = '''    let Some(thread_id) = notification_thread_id(&event) else {
                return Ok(());
            };
            let Some(active) = runtime.active_threads.read().await.get(&thread_id).cloned() else {'''
        new = '''    if !notification_requires_history_replay(&event) {
                return Ok(());
            }
            let Some(thread_id) = notification_thread_id(&event) else {
                return Ok(());
            };
            let Some(active) = runtime.active_threads.read().await.get(&thread_id).cloned() else {'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        anchor = '    #[test]\n    fn agent_ws_url_preserves_reverse_proxy_prefix()'
        test = '''    #[test]
            fn history_replay_ignores_read_and_resume_side_effects() {
                for method in ["deprecationNotice", "thread/tokenUsage/updated",
                    "thread/goal/cleared", "thread/started", "thread/status/changed"] {
                    let event = json!({"method": method, "params": {"threadId": "thread-one"}});
                    assert!(!super::notification_requires_history_replay(&event), "{method}");
                }
                for method in ["turn/started", "turn/completed", "item/started",
                    "item/completed", "item/agentMessage/delta"] {
                    let event = json!({"method": method, "params": {"threadId": "thread-one"}});
                    assert!(super::notification_requires_history_replay(&event), "{method}");
                }
            }

        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, test + anchor)
        path.write_text(text, encoding='utf-8')

        # stdout is captured by the Windows launcher. Keep routine protocol traffic
        # in the bounded daily JSON logs, without a second unbounded stdout copy.
        path = base / 'logging.rs'
        text = path.read_text(encoding='utf-8')
        text = text.replace('use tracing_subscriber::{EnvFilter, fmt, layer::SubscriberExt, util::SubscriberInitExt};',
            'use tracing_subscriber::{EnvFilter, Layer, filter::LevelFilter, fmt, layer::SubscriberExt, util::SubscriberInitExt};')
        text = text.replace('let stdout_layer = fmt::layer().with_target(true);',
            'let stdout_layer = fmt::layer().with_target(true).with_filter(LevelFilter::WARN);')
        text = text.replace('.filename_suffix("jsonl")', '.filename_suffix("jsonl")\n        .max_log_files(3)')
        path.write_text(text, encoding='utf-8')
        PY
    - name: Skip stale projectless references without dropping valid projects
      shell: bash
      run: |
        python <<'PY'
        from pathlib import Path

        path = Path('source/niuma-cli/src/metadata.rs')
        text = path.read_text(encoding='utf-8')
        old = '''            let raw = self
                        .app_server
                        .read_thread_payload(&thread_id, false)
                        .await
                        .with_context(|| format!("failed to read projectless thread {thread_id}"))?;'''
        new = '''            let raw = match self.app_server.read_thread_payload(&thread_id, false).await {
                        Ok(raw) => raw,
                        Err(error) if is_stale_projectless_reference(&error, &thread_id) => {
                            tracing::debug!(thread_id, "skipping stale Codex projectless reference");
                            continue;
                        }
                        Err(error) => return Err(error)
                            .with_context(|| format!("failed to read projectless thread {thread_id}")),
                    };'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        anchor = 'fn empty_state() -> CodexGlobalState {'
        helper = '''// A stale saved id must not make the complete workspace snapshot fail.
        // Only explicit Codex missing-thread responses are skipped, not transport,
        // authentication, decoding or unrelated app-server failures.
        fn is_stale_projectless_reference(error: &anyhow::Error, thread_id: &str) -> bool {
            let Ok(response) = serde_json::from_str::<Value>(&error.to_string()) else {
                return false;
            };
            if response.get("code").and_then(Value::as_i64) != Some(-32600) {
                return false;
            }
            let Some(message) = response.get("message").and_then(Value::as_str) else {
                return false;
            };
            message == format!("thread not loaded: {thread_id}")
                || message == format!("no rollout found for thread id {thread_id}")
        }

        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, helper + anchor)
        anchor = '    #[test]\n    fn workspace_store_orders_and_deduplicates_roots()'
        test = r'''    #[test]
            fn stale_projectless_reference_preserves_other_errors() {
                for message in ["thread not loaded: gone", "no rollout found for thread id gone"] {
                    let error = anyhow::anyhow!(json!({"code": -32600, "message": message}).to_string());
                    assert!(is_stale_projectless_reference(&error, "gone"));
                    assert!(!is_stale_projectless_reference(&error, "different"));
                }
                for message in ["permission denied", "app-server request timed out", "thread not loaded: gone"] {
                    let error = anyhow::anyhow!(message.to_string());
                    assert!(!is_stale_projectless_reference(&error, "gone"));
                }
                let error = anyhow::anyhow!(json!({"code": -32603, "message": "thread not loaded: gone"}).to_string());
                assert!(!is_stale_projectless_reference(&error, "gone"));
            }

            #[tokio::test]
            async fn stale_projectless_reference_does_not_abort_snapshot() {
                crate::paths::ensure_state_dirs().unwrap();
                let root = std::env::temp_dir().join(format!("niuma-stale-{}", uuid::Uuid::new_v4()));
                std::fs::create_dir_all(&root).unwrap();
                let script = root.join("server.py");
                std::fs::write(&script, r#"
        import json, sys
        for line in sys.stdin:
            request = json.loads(line)
            if 'id' not in request:
                continue
            method = request['method']
            if method == 'thread/read' and request['params']['threadId'] == 'gone':
                response = {'error': {'code': -32600, 'message': 'thread not loaded: gone'}}
            elif method == 'thread/read':
                response = {'result': {'thread': {'id': 'good', 'preview': 'Valid thread', 'turns': []}}}
            elif method in ['model/list', 'models/list']:
                response = {'result': {'data': []}}
            else:
                response = {'result': {}}
            response['id'] = request['id']
            print(json.dumps(response), flush=True)
        "#).unwrap();
                let state_path = root.join("state.json");
                let original = json!({"projectless-thread-ids": ["gone", "good"]}).to_string();
                std::fs::write(&state_path, &original).unwrap();
                let client = CodexAppServerClient::start(&[
                    "python".into(), script.to_string_lossy().into_owned()
                ]).await.unwrap();
                let projector = CodexMetadataProjector {
                    app_server: client,
                    workspace_store: CodexWorkspaceStore { global_state_path: state_path.clone() },
                };
                let snapshot = projector.snapshot().await.unwrap();
                assert_eq!(snapshot.threads.len(), 1);
                assert_eq!(snapshot.threads[0].thread_id, "good");
                assert_eq!(std::fs::read_to_string(&state_path).unwrap(), original);
                drop(projector);
                let _ = std::fs::remove_dir_all(root);
            }

        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, test + anchor)
        path.write_text(text, encoding='utf-8')
        PY
    - name: Keep pairing responsive during metadata sync
      shell: bash
      run: |
        python <<'PY'
        from pathlib import Path

        path = Path('source/niuma-cli/src/realtime.rs')
        text = path.read_text(encoding='utf-8')
        old = '''    let mut heartbeat = tokio::time::interval(Duration::from_secs(20));
            loop {'''
        new = '''    let mut heartbeat = tokio::time::interval(Duration::from_secs(20));
            let (metadata_tx, mut metadata_rx) = tokio::sync::mpsc::unbounded_channel();
            let mut metadata_waiters: Vec<MetadataRefreshMessage> = Vec::new();
            let mut metadata_busy = false;
            loop {'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        old = '''                let value: serde_json::Value = serde_json::from_str(&text)?;
                        handle_server_payload(&mut writer, runtime, value).await?;'''
        new = '''                let value: serde_json::Value = serde_json::from_str(&text)?;
                        if wire_kind(&value) == "metadata_refresh" {
                            let inbound: MetadataRefreshMessage = serde_json::from_value(value)?;
                            // Coalesce periodic refreshes for a device while a snapshot
                            // is in flight. Only this loop owns the websocket writer.
                            metadata_waiters.retain(|old| old.device_id != inbound.device_id);
                            metadata_waiters.push(inbound);
                            if !metadata_busy {
                                metadata_busy = true;
                                let sender = metadata_tx.clone();
                                let app_server = runtime.codex_app_server.clone();
                                tokio::spawn(async move {
                                    let result = match app_server {
                                        Some(client) => CodexMetadataProjector::new(client).snapshot().await,
                                        None => Err(anyhow::anyhow!("Codex app-server is unavailable")),
                                    };
                                    let _ = sender.send(result);
                                });
                            }
                            continue;
                        }
                        handle_server_payload(&mut writer, runtime, value).await?;'''
        assert text.count(old) == 1
        text = text.replace(old, new)
        anchor = '''            notification = next_notification(&mut notifications), if notifications.is_some() => {'''
        branch = '''            Some(result) = metadata_rx.recv(), if metadata_busy => {
                        metadata_busy = false;
                        match result {
                            Ok(snapshot) => {
                                for message in metadata::snapshot_wire_messages(&snapshot) {
                                    send_wire_message(&mut writer, message).await?;
                                }
                                for inbound in metadata_waiters.drain(..) {
                                    send_wire_message(&mut writer, metadata_refresh_completed_wire(&inbound, &snapshot)).await?;
                                }
                                info!(project_count = snapshot.projects.len(),
                                    thread_count = snapshot.threads.len(), "gateway_metadata_refresh_done");
                                start_ready_queued_tasks(&mut writer, runtime).await?;
                            }
                            Err(error) => {
                                for inbound in metadata_waiters.drain(..) {
                                    send_wire_message(&mut writer, json!({
                                        "kind": "metadata_refresh_failed", "device_id": inbound.device_id,
                                        "request_id": inbound.request_id, "error": error.to_string(),
                                    })).await?;
                                }
                                warn!("metadata_refresh_failed: {error:#}");
                            }
                        }
                    }
        '''
        assert text.count(anchor) == 1
        text = text.replace(anchor, branch + anchor)
        path.write_text(text, encoding='utf-8')
        PY
    - name: Select stable Rust
      run: |
        rustup update stable --no-self-update
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rustup default stable
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rustc --version
        cargo --version
    - name: Verify encryption tests
      run: |
        cargo test --locked --manifest-path source/niuma-cli/Cargo.toml crypto::tests
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify old and new project metadata formats
      run: |
        cargo test --locked --manifest-path source/niuma-cli/Cargo.toml workspace_store_
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test read-only replay and notification feedback regression
      run: |
        cargo test --locked --manifest-path source/niuma-cli/Cargo.toml history_replay_ -- --test-threads=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test stale thread recovery and error handling
      run: |
        cargo test --locked --manifest-path source/niuma-cli/Cargo.toml stale_projectless_reference -- --test-threads=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build Windows gateway
      run: |
        cargo build --locked --release --manifest-path source/niuma-cli/Cargo.toml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify executable and package
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path output -Force | Out-Null
        Copy-Item -LiteralPath source/niuma-cli/target/release/niuma.exe -Destination output/niuma.exe
        & ./output/niuma.exe --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./output/niuma.exe gateway --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git -C source diff | Out-File -FilePath output/windows-compatibility.patch -Encoding utf8
        (Get-FileHash -Algorithm SHA256 output/niuma.exe).Hash.ToLowerInvariant() + '  niuma.exe' | Out-File -FilePath output/SHA256SUMS.txt -Encoding ascii
        'Gateway built from inspected source. Use gateway --no-open on Windows; service subcommand is macOS-only.' | Out-File -FilePath output/README.txt -Encoding utf8
    - name: Upload Windows gateway
      uses: actions/upload-artifact@v4
      with:
        name: Niuma-windows-gateway
        path: output/
        retention-days: 7
        if-no-files-found: error
